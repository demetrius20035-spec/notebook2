[project]
name = "repairexpert-ai"
version = "1.0.0"
description = "Экспертная система компонентного ремонта электроники с интеграцией LLM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "RepairExpert AI Team" }]

dependencies = [
    "fastapi>=0.111,<0.112",
    "uvicorn[standard]>=0.30,<0.31",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-multipart>=0.0.9",
    "SQLAlchemy>=2.0.31,<2.1",
    "alembic>=1.13,<1.14",
    "PyMySQL>=1.1,<1.2",
    "cryptography>=42,<43",
    "bcrypt>=4.1,<5",
    "PyJWT>=2.8,<3",
    "httpx>=0.27,<0.28",
    "openai>=1.35,<2",
    "requests>=2.32,<3",
    "qdrant-client>=1.9,<1.10",
    "pdfminer.six>=20231228",
    "pytesseract>=0.3.10",
    "Pillow>=10.3,<11",
    "Jinja2>=3.1,<4",
    "WeasyPrint>=62,<63",
    "qrcode[pil]>=7.4,<8",
    "PySide6>=6.7,<6.8",
    "python-dotenv>=1.0,<2",
    "tenacity>=8.4,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<0.24",
    "ruff>=0.5,<0.6",
]

[project.scripts]
repairexpert-api = "backend.main:run"
repairexpert-gui = "gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "gui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
